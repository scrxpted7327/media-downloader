name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff==0.15.22
      - name: Lint
        run: ruff check media_bot supervisor.py restart_bot.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
